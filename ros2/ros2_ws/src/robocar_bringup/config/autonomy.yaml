arrow_follow_node:
  ros__parameters:
    image_topic: /oak/rgb/image_raw
    scan_topic: /scan
    command_topic: /drive
    status_topic: /autonomy/status
    debug_mask_topic: /autonomy/arrow_mask
    # Très basse vitesse de départ ; ajuster seulement après essais contrôlés.
    speed_mps: 0.10
    max_steering_angle: 0.34
    arrow_memory_sec: 2.0
    camera_timeout_sec: 1.5
    scan_timeout_sec: 0.30
    # Le ruban est blanc : garder uniquement les pixels clairs et peu saturés.
    roi_top_ratio: 0.45
    white_saturation_max: 85
    white_value_min: 175
    min_arrow_area_px: 70
    heading_gain: 0.55
    wall_clearance_m: 0.60
    wall_avoidance_gain: 0.22
    front_slow_distance_m: 1.40
