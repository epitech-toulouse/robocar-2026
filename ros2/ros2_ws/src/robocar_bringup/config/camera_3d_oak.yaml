# OAK-D Lite (depthai_ros_driver 2.x), profil de reprise stable à très faible charge.
# Topics : /oak/rgb/*, /oak/stereo/*
# Exemples de paramètres : dossier share/depthai_ros_driver/config/ du paquet
# (pas de substitution « dollar-parenthèse » ici, même en commentaire : le launch depthai les interprète)
/oak:
  ros__parameters:
    camera:
      i_pipeline_type: RGB
      i_nn_type: none
      i_usb_speed: HIGH
      # IMU (BMI270) selon la révision : à vérifier (phase 4)
      i_enable_imu: false
      # pas de projecteur IR sur la Lite
      i_enable_ir: false
    rgb:
      i_resolution: 1080P
      # 1920x1080 × 1/4 = 480x270
      i_set_isp_scale: true
      i_isp_num: 1
      i_isp_den: 4
      i_width: 480
      i_height: 270
      i_fps: 10.0
      r_focus: 1
    left:
      i_resolution: 480P
      i_fps: 10.0
    right:
      i_resolution: 480P
      i_fps: 10.0
